version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      ENV: production
      DATABASE_URL: postgresql://user:password@db:5432/appdb
      JWT_SECRET_KEY: your-secret-key-change-me
      PORT: "5000"
    depends_on:
      - db
